[package]
name = "menu-maker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
crossterm = "0.27"
unicode-width = "0.1"
chrono = "0.4.45"
vt100 = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9.4"
# Music (MIDI composer, ported from miditui)
rodio = { version = "0.19", default-features = false }
rustysynth = "1.3.6"
bincode = "1.3"
hound = "3.5"
midly = "0.5"
feed-rs = "3"
ureq = "2"
